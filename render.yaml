# Optional: example Render service definition. Adapt as needed.
# See https://render.com/docs/deploy-django for details.
services:
  - type: web
    name: art-share
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
  startCommand: "gunicorn artshare.wsgi --log-file -"
  # Run migrations automatically on each deploy
  releaseCommand: "python manage.py migrate"
    envVars:
      - key: SECRET_KEY
        value: "REPLACE_ME"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "art-share.onrender.com"
      - key: DJANGO_SETTINGS_MODULE
        value: "artshare.settings"
